name: CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - develop
    types:
      - closed

jobs:
  cd:
    runs-on: ubuntu-latest
    env:
      REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
      REGISTRY_PORT: ${{ vars.REGISTRY_PORT }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify registry configuration
        run: |
          if [ -z "${REGISTRY_HOST}" ] || [ -z "${REGISTRY_PORT}" ]; then
            echo "::error::Set Actions variables REGISTRY_HOST and REGISTRY_PORT (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi

      - name: Configure Docker for HTTP registry
        uses: docker/setup-docker-action@v4
        with:
          daemon-config: |
            {
              "insecure-registries": ["${{ env.REGISTRY_HOST }}:${{ env.REGISTRY_PORT }}"]
            }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          DOCKER_IMAGE: ${{ env.REGISTRY_HOST }}:${{ env.REGISTRY_PORT }}/frontend:latest
        run: |
          docker compose build
          docker compose push
