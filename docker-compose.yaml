services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    image: ${DOCKER_IMAGE:-ghcr.io/famcan-riskassessment/frontend:latest}
    ports:
      - "8080:80"
    pull_policy: always
    container_name: frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
